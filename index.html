<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Empire City Real Estate — презентация</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#151d24;overflow:hidden;font-family:Arial,sans-serif;color:#fff}button{font:inherit;cursor:pointer}.frame{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}.slide{position:absolute;inset:0;display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity 1.05s ease,visibility 1.05s}.slide.active{opacity:1;visibility:visible;z-index:1}.slide img{width:100%;height:100%;object-fit:contain;display:block;transform:scale(1.012);transition:transform 9s ease-out;filter:none}.slide.active img{transform:scale(1)}.controls{position:fixed;z-index:5;bottom:17px;left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;padding:8px 12px;border-radius:40px;background:rgba(16,22,27,.6);backdrop-filter:blur(9px);border:1px solid #fff3;white-space:nowrap}.controls button,.topbtn{background:#ffffff12;border:1px solid #ffffff47;border-radius:25px;color:#fff;padding:7px 13px}.controls button:hover,.topbtn:hover{background:#ffffff30}.dots{display:flex;gap:6px}.dots button{width:21px;height:4px;padding:0;border-radius:2px;border:0;background:#ffffff70}.dots button.on{background:#e7b776}.count{font-size:12px;color:#fff;letter-spacing:.1em}.top{position:fixed;top:12px;right:14px;z-index:5;display:flex;gap:8px}.topbtn{font-size:12px;background:#13192080}.controls button:focus-visible,.topbtn:focus-visible{outline:2px solid #e7b776}@media(max-width:680px){.controls{bottom:10px;gap:7px;padding:7px}.controls button{padding:7px 9px}.dots button{width:13px}.top{top:6px;right:6px}.slide img{transform:none!important}}@media(prefers-reduced-motion:reduce){.slide,.slide img{transition:none!important;transform:none!important}}
</style></head><body><main class="frame" id="frame" aria-label="Презентация Empire City"></main><div class="top"><button class="topbtn" id="play" aria-label="Автопоказ">▶ Автопоказ</button><button class="topbtn" id="full" aria-label="Полноэкранный режим">⛶</button></div><nav class="controls" aria-label="Навигация"><button id="prev" aria-label="Предыдущий слайд">‹</button><span class="count" id="count">01 / 07</span><div class="dots" id="dots"></div><button id="next" aria-label="Следующий слайд">›</button></nav><script>
const names=['Пелих Иван','7 эмиратов','Dubai 2040','Empire City Real Estate','Миграция капитала','Жизнь в Дубае','7 мастер-планов'];const slides=[],dots=[];const holder=document.getElementById('frame');const nav=document.getElementById('dots');for(let i=0;i<7;i++){const scene=document.createElement('section');scene.className='slide';const img=document.createElement('img');img.src=`assets/slide-${String(i+1).padStart(2,'0')}.webp`;img.alt=names[i];img.decoding='async';if(i===0)img.fetchPriority='high';scene.append(img);holder.append(scene);slides.push(scene);const b=document.createElement('button');b.setAttribute('aria-label',`Слайд ${i+1}`);b.addEventListener('click',()=>show(i));nav.append(b);dots.push(b)}let current=0,playing=false,timer=null;function show(n){current=(n+7)%7;slides.forEach((s,i)=>s.classList.toggle('active',i===current));dots.forEach((b,i)=>b.classList.toggle('on',i===current));document.getElementById('count').textContent=`${String(current+1).padStart(2,'0')} / 07`;}function next(){show(current+1)}function prev(){show(current-1)}function toggle(){playing=!playing;document.getElementById('play').textContent=playing?'Ⅱ Пауза':'▶ Автопоказ';clearInterval(timer);if(playing)timer=setInterval(next,8000)}document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('play').onclick=toggle;document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown'].includes(e.key)){e.preventDefault();next()}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();prev()}if(e.key===' '){e.preventDefault();toggle()}});let sx=0,sy=0;document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))dx<0?next():prev()},{passive:true});show(0);
</script></body></html>

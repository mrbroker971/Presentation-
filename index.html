<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101820"><title>Empire City · Интерактивная презентация</title>
<style>
:root{--gold:#d5ac70;--bg:#111922;--white:#f5efe7}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--white);font-family:Arial,Helvetica,sans-serif}button{font:inherit;cursor:pointer}.stage{position:fixed;inset:0;overflow:hidden;isolation:isolate}.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity 1.05s cubic-bezier(.22,.8,.2,1),visibility 1.05s;display:grid;place-items:center}.scene.active{opacity:1;visibility:visible;z-index:1}.scene::before{content:"";position:absolute;inset:-2%;background-image:var(--image);background-position:center;background-size:cover;filter:blur(26px) brightness(.46);opacity:.75;transform:scale(1.1)}.art{position:relative;width:100%;height:100%;object-fit:contain;z-index:1;filter:brightness(.96);transform:translateY(18px) scale(1.025);opacity:.5;transition:transform 1.5s cubic-bezier(.16,1,.3,1),opacity 1.4s ease}.scene.active .art{transform:translateY(0) scale(1);opacity:1}.scene.active .art.kenburns{animation:breath 15s ease-in-out 1.5s infinite alternate}@keyframes breath{from{transform:scale(1)}to{transform:scale(1.035)}}.veil{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(90deg,rgba(16,24,32,.30),transparent 36%,rgba(16,24,32,.10));opacity:0;transition:opacity 1.8s}.scene.active .veil{opacity:1}.top{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;justify-content:space-between;align-items:center;gap:15px;padding:18px 27px;background:linear-gradient(#111820ae,transparent);pointer-events:none}.brand{letter-spacing:.21em;font-size:11px;color:#f8eee0;text-shadow:0 1px 6px #111}.top button{pointer-events:auto}.toolbar{display:flex;gap:9px}.iconbtn{border:1px solid #ffffff55;background:#1018208e;color:#fff;border-radius:50px;padding:9px 12px;backdrop-filter:blur(10px);font-size:13px}.iconbtn:hover{border-color:var(--gold)}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:19px 26px 22px;background:linear-gradient(transparent,#101820c9)}.counter{font-size:12px;letter-spacing:.22em;white-space:nowrap}.counter b{color:var(--gold);font-weight:400;font-size:19px}.progress{display:flex;gap:5px;flex:1;max-width:510px}.progress button{flex:1;min-width:12px;height:3px;border:none;padding:0;background:#ffffff70;transition:background .35s,height .3s}.progress button.on{background:var(--gold);height:5px}.nav{display:flex;gap:10px}.nav button{width:40px;height:40px;border-radius:50%;background:#111820a0;color:white;border:1px solid #ffffff77;font-size:21px}.nav button:hover{border-color:var(--gold)}.hint{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);z-index:4;white-space:nowrap;opacity:.8;letter-spacing:.1em;font-size:10px;color:#f5e8d3;text-shadow:0 1px 5px #111;pointer-events:none}.intro{position:fixed;z-index:10;inset:0;background:#0f1822;display:grid;place-items:center;animation:introhide .8s 1.3s forwards}.intro span{font-family:Georgia,serif;color:var(--gold);font-size:clamp(28px,5vw,68px);letter-spacing:.2em;animation:introappear 1.3s both}@keyframes introappear{from{opacity:0;letter-spacing:.5em;filter:blur(12px)}to{opacity:1;letter-spacing:.2em;filter:blur(0)}}@keyframes introhide{to{opacity:0;visibility:hidden}}@media(max-width:700px){.top{padding:13px}.brand{font-size:9px;letter-spacing:.12em}.bottom{padding:12px 13px 18px}.hint{bottom:85px;font-size:9px}.iconbtn{padding:8px;font-size:12px}.nav button{width:34px;height:34px}.scene::before{filter:blur(15px) brightness(.47)}.art{object-fit:contain}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.intro{display:none}}
</style></head><body><div class="intro"><span>EMPIRE CITY</span></div><main class="stage" id="stage" aria-label="Анимированная презентация Empire City"></main><header class="top"><div class="brand">EMPIRE CITY · REAL ESTATE</div><div class="toolbar"><button class="iconbtn" id="auto" aria-label="Включить автопоказ">▶ Автопоказ</button><button class="iconbtn" id="full" aria-label="Полноэкранный режим">⛶</button></div></header><div class="hint">← → · ПРОБЕЛ · СВАЙП</div><footer class="bottom"><div class="counter"><b id="num">01</b> / 07</div><nav class="progress" id="progress" aria-label="Выбор слайда"></nav><div class="nav"><button id="prev" aria-label="Предыдущий слайд">‹</button><button id="next" aria-label="Следующий слайд">›</button></div></footer><script>
const slides=[
'Пелих Иван · Empire City Real Estate','Empire City · О компании','ОАЭ · 7 эмиратов','Dubai 2040 · 5 зон роста','7 мастер-планов Дубая','Глобальная миграция капитала','Жизнь в Дубае'];
const stage=document.getElementById('stage'),progress=document.getElementById('progress');let current=0,timer=null;
slides.forEach((name,i)=>{const scene=document.createElement('section');scene.className='scene'+(!i?' active':'');scene.setAttribute('aria-label',name);scene.style.setProperty('--image',`url("assets/slide-${String(i+1).padStart(2,'0')}.jpg")`);const img=document.createElement('img');img.className='art kenburns';img.src=`assets/slide-${String(i+1).padStart(2,'0')}.jpg`;img.alt=name;img.decoding='async';if(i<2)img.loading='eager';else img.loading='lazy';scene.append(img);const veil=document.createElement('div');veil.className='veil';scene.append(veil);stage.append(scene);const dot=document.createElement('button');dot.setAttribute('aria-label',`${i+1}. ${name}`);dot.title=name;dot.className=!i?'on':'';dot.onclick=()=>go(i);progress.append(dot)});
const scenes=[...stage.children],dots=[...progress.children];function go(i){current=(i+slides.length)%slides.length;scenes.forEach((s,j)=>{s.classList.toggle('active',j===current);s.setAttribute('aria-hidden',j!==current)});dots.forEach((s,j)=>s.classList.toggle('on',j===current));document.getElementById('num').textContent=String(current+1).padStart(2,'0');if(timer)restart()}function restart(){clearInterval(timer);timer=setInterval(()=>go(current+1),9000)}function autoplay(){const b=document.getElementById('auto');if(timer){clearInterval(timer);timer=null;b.textContent='▶ Автопоказ';b.setAttribute('aria-label','Включить автопоказ')}else{restart();b.textContent='Ⅱ Пауза';b.setAttribute('aria-label','Остановить автопоказ')}}document.getElementById('auto').onclick=autoplay;document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);document.getElementById('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}});let x=0,y=0;stage.addEventListener('touchstart',e=>{x=e.touches[0].clientX;y=e.touches[0].clientY},{passive:true});stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy))go(current+(dx<0?1:-1))},{passive:true});
</script></body></html>

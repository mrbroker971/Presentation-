nst piece=document.createElement('div');piece.className='piece';piece.style.backgroundImage=`url(${slide.img})`;node.appendChild(piece);canvas.appendChild(node);});(slide.counters||[]).forEach((c,idx)=>{const el=document.createElement('div');el.className='counter';el.dataset.value=String(c.value);el.dataset.decimals=String(c.decimals||0);el.dataset.duration=String(c.duration||1500);el.dataset.prefix=c.prefix||'';el.dataset.suffix=c.suffix||'';el.dataset.group=c.group?'1':'';el.style.left=c.x;el.style.top=c.y;el.style.fontSize=`max(${c.min||'26px'}, ${c.size||'2vw'})`;el.style.animationDelay=`${0.45+idx*0.16}s`;if(c.color)el.style.color=c.color;canvas.appendChild(el);});canvas.appendChild(Object.assign(document.createElement('div'),{className:'vignette'}));scene.appendChild(canvas);deck.appendChild(scene);const dot=document.createElement('button');dot.addEventListener('click',()=>go(i));progress.appendChild(dot);return scene}const scenes=slides.map(buildScene);function updatePieces(){scenes.forEach(scene=>{const canvas=scene.querySelector('.canvas'),cw=canvas.clientWidth,ch=canvas.clientHeight;scene.querySelectorAll('.layer').forEach(layer=>{const piece=layer.querySelector('.piece');piece.style.width=cw+'px';piece.style.height=ch+'px';piece.style.left=(-layer.offsetLeft)+'px';piece.style.top=(-layer.offsetTop)+'px';});});}window.addEventListener('resize',updatePieces);setTimeout(updatePieces,70);function formatNumber(val,decimals,group){let txt=Number(val).toFixed(decimals);if(group){let parts=txt.split('.');parts[0]=Number(parts[0]).toLocaleString('ru-RU');txt=parts[1]?`${parts[0]},${parts[1]}`:parts[0];}else if(decimals){txt=txt.replace('.',',');}return txt}function animateCounters(scene){scene.querySelectorAll('.counter').forEach(el=>{const target=parseFloat(el.dataset.value),decimals=parseInt(el.dataset.decimals||'0',10),duration=parseInt(el.dataset.duration||'1500',10),prefix=el.dataset.prefix||'',suffix=el.dataset.suffix||'',group=el.dataset.group==='1',start=performance.now()+parseFloat(getComputedStyle(el).animationDelay||0)*1000;function step(now){if(now<start){requestAnimationFrame(step);return;}const p=Math.min((now-start)/duration,1),eased=1-Math.pow(1-p,3),val=target*eased;el.textContent=prefix+formatNumber(val,decimals,group)+suffix;if(p<1)requestAnimationFrame(step);else el.textContent=prefix+formatNumber(target,decimals,group)+suffix;}requestAnimationFrame(step);});}let current=0,timer=null,playing=false;function render(){scenes.forEach((s,i)=>s.classList.toggle('active',i===current));[...progress.children].forEach((b,i)=>b.classList.toggle('on',i===current));currentNum.textContent=String(current+1).padStart(2,'0');setTimeout(updatePieces,50);setTimeout(()=>animateCounters(scenes[current]),80);}function go(n){current=(n+slides.length)%slides.length;render()}function next(){go(current+1)}function prev(){go(current-1)}function toggleAutoplay(){playing=!playing;document.getElementById('autoplayBtn').textContent=playing?'❚❚ Остановить':'▶ Автопоказ';clearInterval(timer);if(playing)timer=setInterval(next,6800)}document.getElementById('nextBtn').addEventListener('click',next);document.getElementById('prevBtn').addEventListener('click',prev);document.getElementById('autoplayBtn').addEventListener('click',toggleAutoplay);document.getElementById('fsBtn').addEventListener('click',async()=>{if(!document.fullscreenElement){await document.documentElement.requestFullscreen?.();}else{await document.exitFullscreen?.();}});document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown'].includes(e.key)){e.preventDefault();next();}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();prev();}if(e.key===' '){e.preventDefault();toggleAutoplay();}});let sx=0,sy=0;document.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;},{passive:true});document.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>40&&Math.abs(dx

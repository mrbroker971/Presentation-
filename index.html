<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111820">
<title>Empire City · Layered Presentation</title>
<style>
:root{
  --bg:#111820;
  --gold:#d0a56b;
  --white:#f7f1e8;
  --ui:rgba(17,24,32,.42);
  --line:rgba(255,255,255,.18);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 20%, #273446 0%, #111820 56%);color:var(--white);font-family:Inter,Arial,Helvetica,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
.deck{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
.scene{position:absolute;inset:0;display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity .8s ease, visibility .8s ease}
.scene.active{opacity:1;visibility:visible;z-index:1}
.canvas{position:relative;width:min(100vw, calc(100vh * 1.776833));aspect-ratio:1672/941;max-height:100vh;overflow:hidden;border-radius:min(1.2vw,14px);box-shadow:0 28px 90px rgba(0,0,0,.34)}
.base{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(4px) saturate(.97) brightness(.97);transform:scale(1.03);opacity:.7}
.base::after{content:""}
.vignette{position:absolute;inset:0;background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.04));pointer-events:none}
.layer{position:absolute;overflow:hidden;opacity:0;will-change:transform,opacity;filter:drop-shadow(0 8px 24px rgba(0,0,0,.12));}
.layer .piece{position:absolute;inset:0;width:100%;height:100%;background-image:var(--img);background-size:100% 100%;background-repeat:no-repeat;transform-origin:center center}
.scene.active .layer{animation:fadeLayer .95s both ease}
.scene.active .layer .piece{animation:drift 8s ease-in-out infinite alternate}
.layer.anim-left{transform:translateX(-40px)}
.layer.anim-right{transform:translateX(40px)}
.layer.anim-up{transform:translateY(34px)}
.layer.anim-down{transform:translateY(-32px)}
.layer.anim-zoom{transform:scale(.96)}
.layer.anim-pop{transform:scale(.82)}
.scene.active .layer.anim-left{animation-name:fadeLeft}
.scene.active .layer.anim-right{animation-name:fadeRight}
.scene.active .layer.anim-up{animation-name:fadeUp}
.scene.active .layer.anim-down{animation-name:fadeDown}
.scene.active .layer.anim-zoom{animation-name:fadeZoom}
.scene.active .layer.anim-pop{animation-name:fadePop}
.ui-top{position:fixed;top:0;left:0;right:0;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:5}
.ui-top .project{letter-spacing:.34em;text-transform:uppercase;font-size:11px;color:#f5ede1;opacity:.9;text-shadow:0 1px 12px rgba(0,0,0,.3)}
.toolbar{display:flex;gap:8px;pointer-events:auto}
.btn{border:1px solid rgba(255,255,255,.35);background:var(--ui);backdrop-filter:blur(14px);color:#fff;border-radius:999px;padding:10px 14px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 28px rgba(0,0,0,.18)}
.btn:hover{background:rgba(38,48,60,.55)}
.btn.small{padding:10px 12px;min-width:42px;justify-content:center}
.ui-bottom{position:fixed;left:0;right:0;bottom:0;padding:18px 24px 20px;display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:18px;z-index:5;pointer-events:none}
.counter{pointer-events:auto;background:var(--ui);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:10px 14px;line-height:1;color:#fff}
.counter b{font-size:38px;color:#f1bd7a;font-weight:500}
.counter span{font-size:16px;opacity:.9}
.progress-wrap{display:grid;gap:10px;justify-items:center}
.progress{display:flex;gap:6px;pointer-events:auto;background:rgba(17,24,32,.18);padding:8px 10px;border-radius:999px;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12)}
.progress button{width:72px;max-width:10vw;height:4px;padding:0;border:0;background:rgba(255,255,255,.24);border-radius:999px}
.progress button.on{background:linear-gradient(90deg,#c5924e,#f0c37b)}
.hint{font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.72;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.nav{display:flex;gap:10px;pointer-events:auto}
.nav .btn{border-radius:50%;width:46px;height:46px;padding:0;justify-content:center;font-size:22px}
.caption{position:absolute;left:20px;top:20px;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);padding:8px 12px;border-radius:999px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:0;transform:translateY(-10px);transition:all .6s ease .3s;border:1px solid rgba(255,255,255,.2);z-index:2}
.scene.active .caption{opacity:1;transform:none}
@keyframes fadeLayer{from{opacity:0}to{opacity:1}}
@keyframes fadeLeft{from{opacity:0;transform:translateX(-42px)}to{opacity:1;transform:none}}
@keyframes fadeRight{from{opacity:0;transform:translateX(42px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:none}}
@keyframes fadeZoom{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
@keyframes fadePop{0%{opacity:0;transform:scale(.7)}65%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.012) translate3d(0,-2px,0)}}
@media (max-width:900px){
  .ui-top{padding:12px}
  .ui-top .project{font-size:10px;letter-spacing:.22em}
  .btn{padding:9px 11px;font-size:13px}
  .ui-bottom{padding:12px 12px 16px;grid-template-columns:1fr;justify-items:center;gap:10px}
  .counter{padding:8px 10px}.counter b{font-size:22px}.counter span{font-size:13px}
  .progress button{width:36px;max-width:none}
  .hint{font-size:10px;text-align:center}
  .nav{position:fixed;bottom:16px;right:12px}
  .caption{left:12px;top:12px;font-size:10px}
}
@media (prefers-reduced-motion:reduce){
 .scene,.layer,.caption{transition:none!important;animation:none!important}
 .base{filter:none;opacity:1;transform:none}
 .layer{opacity:1!important;transform:none!important}
 .layer .piece{animation:none!important}
}
</style>
</head>
<body>
<div class="ui-top">
  <div class="project">EMPIRE CITY · REAL ESTATE</div>
  <div class="toolbar">
    <button class="btn" id="autoplayBtn">▶ Автопоказ</button>
    <button class="btn small" id="fsBtn" title="Полный экран">⤢</button>
  </div>
</div>
<div class="deck" id="deck"></div>
<div class="ui-bottom">
  <div class="counter"><b id="currentNum">01</b> <span>/ <span id="totalNum">07</span></span></div>
  <div class="progress-wrap">
    <div class="hint">слои анимируются по очереди · стрелки / свайп · пробел — авто</div>
    <div class="progress" id="progress"></div>
  </div>
  <div class="nav">
    <button class="btn" id="prevBtn" aria-label="Назад">‹</button>
    <button class="btn" id="nextBtn" aria-label="Вперёд">›</button>
  </div>
</div>
<script>
const slides = [{"title": "Титульный слайд", "img": "assets/slide-01.webp", "layers": [["logo", "4%", "4%", "22%", "18%", "left"], ["name", "4%", "26%", "43%", "25%", "up"], ["contacts", "4%", "52%", "33%", "12%", "left"], ["tagleft", "4%", "88%", "18%", "8%", "up"], ["tagright", "88%", "84%", "8%", "11%", "right"], ["motto", "87%", "4%", "9%", "16%", "down"]]}, {"title": "ОАЭ — 7 эмиратов", "img": "assets/slide-02.webp", "layers": [["leftpanel", "0%", "0%", "24%", "100%", "left"], ["map", "19%", "0%", "48%", "100%", "zoom"], ["rightcards", "67%", "0%", "33%", "100%", "right"], ["legend", "2%", "78%", "15%", "17%", "up"]]}, {"title": "Dubai 2040", "img": "assets/slide-03.webp", "layers": [["title", "0%", "0%", "65%", "21%", "up"], ["map", "0%", "18%", "64%", "55%", "zoom"], ["rightcards", "64%", "0%", "36%", "100%", "right"], ["bottomstats", "0%", "73%", "64%", "27%", "up"], ["growthbox", "53%", "73%", "11%", "27%", "pop"]]}, {"title": "О компании", "img": "assets/slide-04.webp", "layers": [["leftintro", "0%", "0%", "24%", "42%", "left"], ["people", "24%", "0%", "76%", "41%", "zoom"], ["metrics", "0%", "41%", "68%", "18%", "up"], ["partners", "31%", "58%", "35%", "26%", "up"], ["reasons", "67%", "41%", "33%", "43%", "right"], ["footer", "0%", "91%", "100%", "9%", "down"]]}, {"title": "Глобальная миграция капитала", "img": "assets/slide-05.webp", "layers": [["leftpanel", "0%", "0%", "24%", "83%", "left"], ["world", "23%", "7%", "77%", "72%", "zoom"], ["uae_bubble", "45%", "25%", "16%", "24%", "pop"], ["bottomline", "0%", "83%", "100%", "17%", "up"]]}, {"title": "Lifestyle", "img": "assets/slide-06.webp", "layers": [["leftpanel", "0%", "0%", "22%", "82%", "left"], ["title", "22%", "0%", "43%", "15%", "up"], ["beach", "22%", "8%", "78%", "61%", "zoom"], ["bottomstats", "0%", "82%", "100%", "18%", "up"]]}, {"title": "7 мастер-планов Дубая", "img": "assets/slide-07.webp", "layers": [["header", "0%", "0%", "100%", "19%", "up"], ["timeline", "0%", "18%", "100%", "27%", "left"], ["chart", "0%", "45%", "51%", "39%", "up"], ["drivers", "51%", "45%", "49%", "39%", "right"], ["footer", "0%", "84%", "100%", "16%", "down"]]}];
const deck = document.getElementById('deck');
const progress = document.getElementById('progress');
const currentNum = document.getElementById('currentNum');
const totalNum = document.getElementById('totalNum');
totalNum.textContent = String(slides.length).padStart(2,'0');

function buildScene(slide, i){
  const scene = document.createElement('section');
  scene.className = 'scene';
  scene.dataset.index = i;
  const canvas = document.createElement('div');
  canvas.className = 'canvas';
  canvas.style.setProperty('--img', `url(${slide.img})`);
  const base = document.createElement('img');
  base.className = 'base';
  base.src = slide.img;
  base.alt = slide.title;
  canvas.appendChild(base);
  const caption = document.createElement('div');
  caption.className = 'caption';
  caption.textContent = slide.title;
  canvas.appendChild(caption);
  slide.layers.forEach((layer, idx) => {
    const [name,x,y,w,h,anim] = layer;
    const node = document.createElement('div');
    node.className = `layer anim-${anim}`;
    node.style.left = x; node.style.top = y; node.style.width = w; node.style.height = h;
    node.style.animationDelay = `${0.12 + idx*0.16}s`;
    node.style.zIndex = 2 + idx;
    const piece = document.createElement('div');
    piece.className = 'piece';
    piece.style.backgroundImage = `url(${slide.img})`;
    piece.style.width = '1000%'; // overridden below by JS after layout
    node.appendChild(piece);
    canvas.appendChild(node);
  });
  const vignette = document.createElement('div');
  vignette.className = 'vignette';
  canvas.appendChild(vignette);
  scene.appendChild(canvas);
  deck.appendChild(scene);
  const dot = document.createElement('button');
  dot.addEventListener('click', ()=>go(i));
  progress.appendChild(dot);
  return scene;
}

const scenes = slides.map(buildScene);

function updatePieces(){
  scenes.forEach(scene => {
    const canvas = scene.querySelector('.canvas');
    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    scene.querySelectorAll('.layer').forEach(layer => {
      const piece = layer.querySelector('.piece');
      const x = layer.offsetLeft, y = layer.offsetTop, w = layer.offsetWidth, h = layer.offsetHeight;
      piece.style.width = cw + 'px';
      piece.style.height = ch + 'px';
      piece.style.left = (-x) + 'px';
      piece.style.top = (-y) + 'px';
    });
  });
}
window.addEventListener('resize', updatePieces);
setTimeout(updatePieces, 60);

let current = 0, timer = null, playing = false;
function render(){
  scenes.forEach((s,i)=>s.classList.toggle('active', i===current));
  [...progress.children].forEach((b,i)=>b.classList.toggle('on',i===current));
  currentNum.textContent = String(current+1).padStart(2,'0');
  setTimeout(updatePieces, 40);
}
function go(n){
  current = (n + slides.length) % slides.length;
  render();
}
function next(){ go(current+1); }
function prev(){ go(current-1); }
function toggleAutoplay(){
  playing = !playing;
  document.getElementById('autoplayBtn').textContent = (playing ? '❚❚ Остановить' : '▶ Автопоказ');
  clearInterval(timer);
  if(playing) timer = setInterval(next, 6500);
}
document.getElementById('nextBtn').addEventListener('click', next);
document.getElementById('prevBtn').addEventListener('click', prev);
document.getElementById('autoplayBtn').addEventListener('click', toggleAutoplay);
document.getElementById('fsBtn').addEventListener('click', async()=>{ if(!document.fullscreenElement){ await document.documentElement.requestFullscreen?.(); } else { await document.exitFullscreen?.(); }});
document.addEventListener('keydown', e=>{
  if(['ArrowRight','ArrowDown','PageDown'].includes(e.key)){e.preventDefault();next();}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();prev();}
  if(e.key===' '){e.preventDefault();toggleAutoplay();}
});
let sx=0, sy=0;
document.addEventListener('touchstart', e=>{const t=e.touches[0]; sx=t.clientX; sy=t.clientY;},{passive:true});
document.addEventListener('touchend', e=>{const t=e.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy; if(Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)){dx<0?next():prev();}});
render();
</script>
</body></html>
